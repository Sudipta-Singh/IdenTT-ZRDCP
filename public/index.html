<body>
  <div id="app"></div>
  <!-- Plain (non-module) script, built from src/app/main.js via esbuild. Bundling into a single
       IIFE is what lets this page work when opened directly as a file:// URL — browsers block
       ES module imports (type="module") from file:// due to CORS, but a plain bundled script has
       no such restriction. Rebuild with `npm run build` after changing anything under src/. -->
